<svg baseProfile="full" height="1350" version="1.1" viewBox="0 0 1080 1350" width="1080" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F8FAFC" height="1350" width="1080" x="0" y="0" /><rect fill="#0D2743" height="106" width="1080" x="0" y="0" /><text fill="white" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="70" y="67">FX Learning Lab</text><text fill="#BFD6E3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="end" x="1010" y="68">LESSON 01   ·   01 / 05</text><text fill="#11243B" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" text-anchor="start" x="72" y="193">One pair. Two currencies.</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" text-anchor="start" x="72" y="251">An exchange rate always compares two currencies.</text><line stroke="#DCE6EC" stroke-width="3" x1="72" x2="1008" y1="277" y2="277" /><rect fill="#E7F2FC" height="355" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="445" x="74" y="336" /><rect fill="#DAF5F3" height="355" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="445" x="560" y="336" /><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" x="296" y="426">BASE CURRENCY</text><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" x="296" y="521">EUR</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" text-anchor="middle" x="296" y="600">Euro</text><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" x="782" y="426">QUOTE CURRENCY</text><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" x="782" y="521">USD</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" text-anchor="middle" x="782" y="600">US Dollar</text><rect fill="#FFFFFF" height="195" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="930" x="74" y="736" /><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" text-anchor="middle" x="539" y="809">EUR/USD = 1.1000</text><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" text-anchor="middle" x="539" y="884">1 EUR = 1.1000 USD</text><line stroke="#007F86" stroke-linecap="round" stroke-width="7" x1="240" x2="827" y1="975" y2="975" /><polygon fill="#007F86" points="827,975 813.143593539449,983.0 813.143593539449,967.0" /><text fill="#11243B" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" text-anchor="middle" x="540" y="1040">If EUR/USD rises, EUR strengthens</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="400" text-anchor="middle" x="540" y="1105">relative to USD — not necessarily to every currency.</text><rect fill="#FFF0D7" height="54" rx="22" ry="22" stroke="none" stroke-width="0" width="370" x="355" y="1150" /><text fill="#B45309" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="540.0" y="1187">EXAMPLE ONLY</text><line stroke="#DCE6EC" stroke-linecap="round" stroke-width="3" x1="72" x2="1008" y1="1235" y2="1235" /><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start" x="72" y="1280">Educational example · Not live market data</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start" x="72" y="1317">Leveraged FX trading involves substantial risk.</text></svg>