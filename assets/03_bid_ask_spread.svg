<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1350" version="1.1" viewBox="0 0 1080 1350" width="1080" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F8FAFC" height="1350" width="1080" x="0" y="0" /><rect fill="#0D2743" height="106" width="1080" x="0" y="0" /><text fill="white" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="start" x="70" y="67">FX Learning Lab</text><text fill="#BFD6E3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="end" x="1010" y="68">LESSON 01   ·   03 / 05</text><text fill="#11243B" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" text-anchor="start" x="72" y="193">Bid, ask, spread</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" text-anchor="start" x="72" y="251">Buying and selling can use different quoted prices.</text><line stroke="#DCE6EC" stroke-width="3" x1="72" x2="1008" y1="277" y2="277" /><rect fill="#E7F2FC" height="360" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="445" x="72" y="348" /><rect fill="#DAF5F3" height="360" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="445" x="563" y="348" /><rect fill="#FFFFFF" height="54" rx="22" ry="22" stroke="none" stroke-width="0" width="188" x="199" y="395" /><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="293.0" y="432">BID</text><rect fill="#FFFFFF" height="54" rx="22" ry="22" stroke="none" stroke-width="0" width="188" x="698" y="395" /><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="792.0" y="432">ASK</text><text fill="#11243B" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" text-anchor="middle" x="295" y="524">YOU SELL</text><text fill="#11243B" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" text-anchor="middle" x="785" y="524">YOU BUY</text><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" text-anchor="middle" x="295" y="624">1.0998</text><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" text-anchor="middle" x="785" y="624">1.1000</text><rect fill="#FFFFFF" height="198" rx="22" ry="22" stroke="#DCE6EC" stroke-width="3" width="936" x="72" y="758" /><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="middle" x="540" y="820">SPREAD = ASK − BID</text><text fill="#0D2743" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" text-anchor="middle" x="540" y="885">1.1000 − 1.0998 = 0.0002</text><rect fill="#DAF5F3" height="54" rx="22" ry="22" stroke="none" stroke-width="0" width="810" x="135" y="986" /><text fill="#007F86" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" x="540.0" y="1023">0.0002 ÷ 0.0001 = 2 PIPS</text><rect fill="#FFF0D7" height="108" rx="22" ry="22" stroke="#FFF0D7" stroke-width="3" width="930" x="74" y="1082" /><text fill="#B45309" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start" x="106" y="1121">Buying, then immediately selling at unchanged prices:</text><text fill="#B45309" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" text-anchor="start" x="106" y="1162">−2 pips before other charges. Quotes can change.</text><line stroke="#DCE6EC" stroke-linecap="round" stroke-width="3" x1="72" x2="1008" y1="1235" y2="1235" /><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start" x="72" y="1280">EUR/USD illustrative values · 1 pip = 0.0001</text><text fill="#5F7284" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" text-anchor="start" x="72" y="1317">Leveraged FX trading involves substantial risk.</text></svg>